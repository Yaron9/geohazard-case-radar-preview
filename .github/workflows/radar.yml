name: Collect real geohazard reports
run-name: Radar scan · ${{ github.event.inputs.request_id || github.run_number }}
on:
  schedule:
    - cron: '37 0 * * *'
  workflow_dispatch:
    inputs:
      request_id:
        description: '页面扫描请求关联号'
        required: false
        type: string
      query:
        description: '公开网页搜索关键词'
        required: false
        default: '地质灾害 成功避险'
        type: string
      channels:
        description: '主动检索渠道，逗号分隔：web,wechat,video'
        required: false
        default: 'web'
        type: string
      mode:
        description: 'all=搜索发现+来源扫描，sources=仅来源'
        required: false
        default: all
        type: choice
        options: [all, sources]
permissions:
  contents: write
concurrency:
  group: real-radar-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r collector/requirements.txt
      - name: Install platform media browser
        run: python collector/setup_platforms.py
      - name: Install pinned TrendRadar upstream
        run: |
          python collector/setup_trendradar.py
          PYTHONPATH=collector python -c "from trendradar_bridge import modules; modules(); print('TrendRadar collection modules ready')"
      - run: python -m unittest discover -s collector -p 'test_*.py'
      - name: Run public search discovery and configured sources
        env:
          RADAR_QUERY: ${{ github.event.inputs.query || '地质灾害 成功避险' }}
          RADAR_CHANNELS: ${{ github.event.inputs.channels || 'web' }}
          RADAR_MODE: ${{ github.event.inputs.mode || 'all' }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python collector/crawl.py --output data/live-feed.json
      - name: Persist real feed for Web readers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/live-feed.json
          if git diff --cached --quiet; then
            echo 'No feed change.'
          else
            git commit -m 'Update real geohazard report feed'
            git pull --rebase origin main
            git push origin main
          fi
      - name: Summarize actual source results
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          f=json.load(open('data/live-feed.json'))
          r=f['runs'][0]
          print('# Real collection result')
          print(f"Retained reports: {len(f['items'])}; new: {r['newRecords']}; changed: {r['changedRecords']}")
          for s in r['results']:
              print(f"- {s['name']}: {s['status']} / HTTP {s['httpStatus']} / {s['recordsFound']} candidates")
          print('Candidate reports require manual case verification. Failed sources are retained explicitly.')
          PY
